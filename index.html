<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Cost Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Meeting Cost Counter</h1>

    <div id="setup">
      <div class="input-group">
        <label for="people">Number of people</label>
        <input type="number" id="people" min="2" value="2">
      </div>
      <div class="input-group">
        <label for="rate">Average hourly rate (€)</label>
        <input type="number" id="rate" min="0" step="0.01" value="100">
      </div>
      <button id="startBtn">Start counting</button>
    </div>

    <div id="timer" class="hidden">
      <div class="display">
        <div class="time" id="elapsed">00:00:00</div>
        <div class="cost" id="totalCost">€0.00</div>
        <div class="perSecond" id="perSecond">€0.00 / sec</div>
      </div>
      <div class="summary">
        <div class="summary-item">
          <span class="summary-label">People</span>
          <span class="summary-value" id="summaryPeople">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Hourly rate</span>
          <span class="summary-value" id="summaryAvg">€0.00</span>
        </div>
      </div>
      <div class="people-controls">
        <button id="removePersonBtn" class="person-btn">−1</button>
        <button id="addPersonBtn" class="person-btn">+1</button>
      </div>
      <div class="buttons">
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
